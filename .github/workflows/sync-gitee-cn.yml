name: Sync Gitee CN

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-gitee-cn:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 获取 GitHub main 最新源码
      # ============================================================
      - name: Checkout GitHub
        uses: actions/checkout@v4


      # ============================================================
      # 2. 生成国内版油猴脚本
      #
      # GitHub 原版：
      # @updateURL   → CDN
      # @downloadURL → CDN
      #
      # Gitee CN：
      # @updateURL   → Gitee API Raw
      # @downloadURL → Gitee API Raw
      # ============================================================
      - name: Generate CN userscript
        env:
          URL_TOKEN: ${{ secrets.URL_TOKEN }}
        run: |
          set -e

          FILE="GXELA-auto-learn.user.js"

          if [ ! -f "$FILE" ]; then
            echo "错误：找不到 $FILE"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          file = Path("GXELA-auto-learn.user.js")

          text = file.read_text(encoding="utf-8")

          token = os.environ["URL_TOKEN"]

          # --------------------------------------------------------
          # Gitee CN 最终 Raw 地址
          # --------------------------------------------------------
          cn_url = (
              "https://gitee.com/api/v5/repos/"
              "underdestiny/GXELA/raw/"
              "GXELA-auto-learn.user.js"
              "?ref=cn"
              f"&access_token={token}"
          )

          print("国内版地址：")
          print(cn_url)

          # --------------------------------------------------------
          # 替换 @updateURL
          # --------------------------------------------------------
          text, n1 = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # 替换 @downloadURL
          # --------------------------------------------------------
          text, n2 = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if n1 != 1:
              raise SystemExit(
                  "错误：没有找到唯一的 @updateURL"
              )

          if n2 != 1:
              raise SystemExit(
                  "错误：没有找到唯一的 @downloadURL"
              )

          file.write_text(text, encoding="utf-8")

          print("")
          print("========================================")
          print("CN 用户脚本生成成功")
          print("========================================")
          print("@updateURL / @downloadURL 已替换")
          PY


      # ============================================================
      # 3. 获取 Gitee cn 分支当前文件 SHA
      # ============================================================
      - name: Get Gitee file SHA
        id: gitee_file
        env:
          URL_TOKEN: ${{ secrets.URL_TOKEN }}
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import urllib.error

          token = os.environ["URL_TOKEN"]

          api_url = (
              "https://gitee.com/api/v5/repos/"
              "underdestiny/GXELA/contents/"
              "GXELA-auto-learn.user.js"
          )

          params = urllib.parse.urlencode({
              "access_token": token,
              "ref": "cn"
          })

          url = f"{api_url}?{params}"

          print("正在读取 Gitee cn 分支文件信息...")

          request = urllib.request.Request(
              url,
              method="GET"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              print("Gitee API 返回错误：")

              body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(body)

              raise

          if isinstance(data, list):
              raise RuntimeError(
                  "Gitee 返回了列表，而不是文件对象。"
              )

          sha = data.get("sha")

          if not sha:
              raise RuntimeError(
                  "无法获取 Gitee 文件 SHA。"
              )

          print(f"Gitee 当前文件 SHA: {sha}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(f"sha={sha}\n")
          PY


      # ============================================================
      # 4. 使用 Python 直接调用 Gitee API 更新文件
      #
      # 不把巨大 JS 内容放进环境变量
      # 避免：
      #
      # Argument list too long
      # ============================================================
      - name: Update Gitee CN
        env:
          URL_TOKEN: ${{ secrets.URL_TOKEN }}
          GITEE_SHA: ${{ steps.gitee_file.outputs.sha }}
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          import base64
          import urllib.request
          import urllib.error

          token = os.environ["URL_TOKEN"]
          sha = os.environ["GITEE_SHA"]

          file = "GXELA-auto-learn.user.js"

          api_url = (
              "https://gitee.com/api/v5/repos/"
              "underdestiny/GXELA/contents/"
              "GXELA-auto-learn.user.js"
          )

          # --------------------------------------------------------
          # 读取国内版文件
          # --------------------------------------------------------
          with open(file, "rb") as f:
              content = f.read()

          print(f"文件大小: {len(content)} bytes")

          # --------------------------------------------------------
          # Base64
          # --------------------------------------------------------
          encoded = base64.b64encode(content).decode("ascii")

          # --------------------------------------------------------
          # Gitee API 请求
          # --------------------------------------------------------
          payload = {
              "access_token": token,
              "message": (
                  "Sync CN version from GitHub "
                  + os.environ.get("GITHUB_SHA", "")[:7]
              ),
              "content": encoded,
              "sha": sha,
              "branch": "cn"
          }

          body = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          print("正在更新 Gitee cn 分支...")

          request = urllib.request.Request(
              api_url,
              data=body,
              method="PUT",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:

                  response_body = response.read().decode(
                      "utf-8"
                  )

                  result = json.loads(response_body)

          except urllib.error.HTTPError as e:

              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("")
              print("========================================")
              print("Gitee API 更新失败")
              print("========================================")
              print(error_body)

              raise

          print("")
          print("========================================")
          print("Gitee CN 更新成功")
          print("========================================")

          if isinstance(result, dict):

              commit = result.get("commit")

              if commit:
                  print(
                      "Commit SHA:",
                      commit.get("sha", "")
                  )

                  print(
                      "Commit Message:",
                      commit.get("message", "")
                  )

          print("")
          print(
              "CN Raw:"
              " https://gitee.com/underdestiny/GXELA/"
              "raw/cn/GXELA-auto-learn.user.js"
          )
          PY
