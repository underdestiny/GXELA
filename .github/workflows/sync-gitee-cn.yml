name: Sync Gitee CN

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 获取 GitHub main 最新源码
      # ============================================================
      - name: Checkout GitHub
        uses: actions/checkout@v4


      # ============================================================
      # 2. 检查源码文件
      # ============================================================
      - name: Check userscript
        run: |
          set -e

          FILE="GXELA-auto-learn.user.js"

          if [ ! -f "$FILE" ]; then
            echo "错误：找不到 $FILE"
            exit 1
          fi

          echo "找到 $FILE"
          wc -c "$FILE"


      # ============================================================
      # 3. 生成 Gitee 国内版
      #
      # GitHub：
      #   GXELA-auto-learn.user.js
      #
      # Gitee：
      #   core.user.js
      #
      # 同时修改：
      #   @updateURL
      #   @downloadURL
      # ============================================================
      - name: Generate CN version
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("GXELA-auto-learn.user.js")
          target = Path("core.user.js")

          text = source.read_text(encoding="utf-8")

          # Gitee 国内版 Raw 地址
          cn_url = (
              "https://gitee.com/underdestiny/core/"
              "raw/master/core.user.js"
          )

          # --------------------------------------------------------
          # 替换 @updateURL
          # --------------------------------------------------------
          text, n1 = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # 替换 @downloadURL
          # --------------------------------------------------------
          text, n2 = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # 检查替换结果
          # --------------------------------------------------------
          if n1 != 1:
              raise SystemExit(
                  "错误：没有找到唯一的 @updateURL"
              )

          if n2 != 1:
              raise SystemExit(
                  "错误：没有找到唯一的 @downloadURL"
              )

          # --------------------------------------------------------
          # 输出 Gitee 版本
          # --------------------------------------------------------
          target.write_text(
              text,
              encoding="utf-8"
          )

          print("")
          print("========================================")
          print("Gitee CN 版本生成成功")
          print("========================================")
          print(f"源文件：{source}")
          print(f"目标文件：{target}")
          print(f"更新地址：{cn_url}")
          print("========================================")
          PY


      # ============================================================
      # 4. 检查 Gitee 版本的元数据
      # ============================================================
      - name: Verify CN version
        run: |
          set -e

          echo "检查 @updateURL："
          grep -E '^[[:space:]]*//[[:space:]]*@updateURL' core.user.js

          echo ""
          echo "检查 @downloadURL："
          grep -E '^[[:space:]]*//[[:space:]]*@downloadURL' core.user.js

          echo ""
          echo "检查 Gitee 地址："

          grep -q \
            "https://gitee.com/underdestiny/core/raw/master/core.user.js" \
            core.user.js

          echo "Gitee URL 检查通过"


      # ============================================================
      # 5. Clone Gitee 国内发行仓库
      # ============================================================
      - name: Clone Gitee repository
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e

          git clone \
            --branch master \
            --single-branch \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/underdestiny/core.git" \
            gitee-core


      # ============================================================
      # 6. 更新 Gitee core.user.js
      # ============================================================
      - name: Update Gitee file
        run: |
          set -e

          cp \
            core.user.js \
            gitee-core/core.user.js

          echo "Gitee 文件已更新："
          ls -lh gitee-core/core.user.js


      # ============================================================
      # 7. 删除 Gitee 中可能存在的旧文件
      # ============================================================
      - name: Remove old files
        working-directory: gitee-core
        run: |
          set -e

          # 如果以前有其他明显的 GXELA 文件名，可以在这里删除
          if [ -f "GXELA-auto-learn.user.js" ]; then
            git rm GXELA-auto-learn.user.js
          fi


      # ============================================================
      # 8. 提交
      # ============================================================
      - name: Commit changes
        working-directory: gitee-core
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add core.user.js

          # 没有变化则不提交
          if git diff --cached --quiet; then
            echo "Gitee 没有变化，无需提交"
            exit 0
          fi

          git commit \
            -m "Sync from GitHub ${GITHUB_SHA::7}"


      # ============================================================
      # 9. Push 到 Gitee master
      # ============================================================
      - name: Push to Gitee
        working-directory: gitee-core
        run: |
          set -e

          git push origin master

          echo ""
          echo "========================================"
          echo "Gitee CN 同步成功"
          echo "========================================"
          echo ""
          echo "国内安装/更新地址："
          echo "https://gitee.com/underdestiny/core/raw/master/core.user.js"
