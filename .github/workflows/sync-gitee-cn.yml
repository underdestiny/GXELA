name: Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 获取源码
      - name: Checkout
        uses: actions/checkout@v4


      # 生成发行文件
      - name: Prepare
        env:
          REPO: ${{ secrets.GIT_REPO }}
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re
          import os

          SOURCE = Path("GXELA-auto-learn.user.js")
          OUTPUT = Path("core.user.js")

          REPO = os.environ["REPO"].strip().rstrip("/")

          if not REPO:
              raise SystemExit("repository is empty")

          # ==========================================================
          # 从仓库地址解析：
          #
          # https://example.com/user/project.git
          #
          # 得到：
          # scheme = https
          # host   = example.com
          # path   = /user/project.git
          # ==========================================================
          parsed = urlparse(REPO)

          if not parsed.scheme or not parsed.netloc:
              raise SystemExit("invalid repository URL")

          path = parsed.path.strip("/")

          if path.endswith(".git"):
              path = path[:-4]

          parts = path.split("/")

          if len(parts) < 2:
              raise SystemExit("invalid repository path")

          owner = parts[-2]
          repo = parts[-1]

          # ==========================================================
          # 默认发行分支和文件名
          # ==========================================================
          branch = "master"
          filename = "core.user.js"

          # ==========================================================
          # 自动构造 Raw 地址
          #
          # 不写死任何平台域名
          # ==========================================================
          raw_url = (
              f"{parsed.scheme}://{parsed.netloc}/"
              f"{owner}/{repo}/raw/"
              f"{branch}/{filename}"
          )

          print("source:", SOURCE)
          print("output:", OUTPUT)

          # ==========================================================
          # 读取源码
          # ==========================================================
          if not SOURCE.exists():
              raise SystemExit("source file not found")

          text = SOURCE.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # 替换 @updateURL
          # ==========================================================
          text, count_update = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{raw_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # ==========================================================
          # 替换 @downloadURL
          # ==========================================================
          text, count_download = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{raw_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if count_update != 1:
              raise SystemExit(
                  "@updateURL not found"
              )

          if count_download != 1:
              raise SystemExit(
                  "@downloadURL not found"
              )

          # ==========================================================
          # 写入发行文件
          # ==========================================================
          OUTPUT.write_text(
              text,
              encoding="utf-8"
          )

          print("prepare completed")
          PY


      # 检查生成文件
      - name: Verify
        run: |
          set -e

          test -f core.user.js

          grep -q "@updateURL" core.user.js
          grep -q "@downloadURL" core.user.js

          echo "verification completed"


      # 获取目标仓库
      - name: Fetch
        env:
          TOKEN: ${{ secrets.GIT_TOKEN }}
          REPO: ${{ secrets.GIT_REPO }}
        run: |
          set -e

          AUTH_REPO="${REPO/https:\/\//https:\/\/oauth2:${TOKEN}@}"

          git clone \
            --branch master \
            --single-branch \
            "$AUTH_REPO" \
            target


      # 更新文件
      - name: Deploy
        run: |
          set -e

          cp \
            core.user.js \
            target/core.user.js


      # 提交
      - name: Commit
        working-directory: target
        run: |
          set -e

          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"

          git add core.user.js

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "update"


      # 推送
      - name: Push
        working-directory: target
        env:
          TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -e

          git push origin master
