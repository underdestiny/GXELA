name: Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 生成发行文件
      # ============================================================
      - name: Prepare
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
        run: |
          set -e

          if [ ! -f "GXELA-auto-learn.user.js" ]; then
            echo "source file not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          from urllib.parse import urlparse

          SRC = Path("GXELA-auto-learn.user.js")
          DST = Path("core.user.js")

          repo = os.environ["GIT_REPO"].strip().rstrip("/")

          parsed = urlparse(repo)

          if not parsed.scheme or not parsed.netloc:
              raise SystemExit("invalid repository")

          # 从仓库地址中提取：
          #
          # https://example.com/user/project.git
          #
          # ↓
          #
          # https://example.com/user/project
          #
          base = f"{parsed.scheme}://{parsed.netloc}"

          path = parsed.path.strip("/")

          if path.endswith(".git"):
              path = path[:-4]

          # 分割仓库路径
          parts = path.split("/")

          if len(parts) < 2:
              raise SystemExit("invalid repository path")

          owner = parts[-2]
          repo_name = parts[-1]

          # 构造 Raw 地址
          raw_url = (
              f"{base}/{owner}/{repo_name}"
              f"/raw/master/core.user.js"
          )

          text = SRC.read_text(encoding="utf-8")

          # 更新地址
          text, n1 = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{raw_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # 下载地址
          text, n2 = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{raw_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if n1 != 1:
              raise SystemExit("updateURL not found")

          if n2 != 1:
              raise SystemExit("downloadURL not found")

          DST.write_text(
              text,
              encoding="utf-8"
          )

          print("prepare completed")
          PY


      - name: Verify
        run: |
          set -e

          test -f core.user.js

          grep -q "@updateURL" core.user.js
          grep -q "@downloadURL" core.user.js

          echo "verification completed"


      # ============================================================
      # 获取目标仓库
      # ============================================================
      - name: Fetch
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -e

          AUTH_REPO="$GIT_REPO"

          AUTH_REPO="${AUTH_REPO/https:\/\//https:\/\/oauth2:${GIT_TOKEN}@}"

          git clone \
            --branch master \
            --single-branch \
            "$AUTH_REPO" \
            target


      # ============================================================
      # 更新文件
      # ============================================================
      - name: Deploy
        run: |
          set -e

          cp \
            core.user.js \
            target/core.user.js


      # ============================================================
      # 提交
      # ============================================================
      - name: Commit
        working-directory: target
        run: |
          set -e

          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"

          git add core.user.js

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "update"


      # ============================================================
      # 推送
      # ============================================================
      - name: Push
        working-directory: target
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -e

          git push origin master
