name: Sync Gitee CN

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取 GitHub 当前 main 最新代码
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 修改国内版油猴脚本的更新地址
      - name: Generate CN userscript
        shell: bash
        run: |
          set -e

          FILE="GXELA-auto-learn.user.js"

          if [ ! -f "$FILE" ]; then
            echo "错误：找不到 $FILE"
            exit 1
          fi

          CN_URL="https://gitee.com/underdestiny/GXELA/raw/cn/GXELA-auto-learn.user.js"

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("GXELA-auto-learn.user.js")
          text = file.read_text(encoding="utf-8")

          cn_url = "https://gitee.com/underdestiny/GXELA/raw/cn/GXELA-auto-learn.user.js"

          # 替换 @updateURL
          text, n1 = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # 替换 @downloadURL
          text, n2 = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if n1 != 1:
              raise SystemExit("错误：没有找到唯一的 @updateURL")

          if n2 != 1:
              raise SystemExit("错误：没有找到唯一的 @downloadURL")

          file.write_text(text, encoding="utf-8")

          print("国内版元数据修改完成")
          print(f"@updateURL   -> {cn_url}")
          print(f"@downloadURL -> {cn_url}")
          PY

      # 3. Clone Gitee cn 分支
      - name: Clone Gitee CN branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e

          git clone \
            --branch cn \
            --single-branch \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/underdestiny/GXELA.git" \
            gitee-cn

      # 4. 将 GitHub 最新脚本复制到 Gitee cn 分支
      - name: Update Gitee CN script
        run: |
          set -e

          cp GXELA-auto-learn.user.js \
             gitee-cn/GXELA-auto-learn.user.js

      # 5. 提交并推送到 Gitee cn
      - name: Push to Gitee CN
        working-directory: gitee-cn
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add GXELA-auto-learn.user.js

          if git diff --cached --quiet; then
            echo "没有文件变化，无需提交"
            exit 0
          fi

          git commit -m "Sync from GitHub ${{ github.sha }}"
          git push origin cn
