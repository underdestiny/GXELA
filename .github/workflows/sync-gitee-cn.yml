name: Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Prepare
        env:
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -e

          if [ ! -f "GXELA-auto-learn.user.js" ]; then
            echo "source file not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          from urllib.parse import urlparse

          source = Path("GXELA-auto-learn.user.js")
          target = Path("core.user.js")

          repo_url = os.environ["GITEE_REPO"].strip().rstrip("/")

          parsed = urlparse(repo_url)

          if not parsed.scheme or not parsed.netloc:
              raise SystemExit("invalid repository")

          # 提取协议和域名
          base_url = f"{parsed.scheme}://{parsed.netloc}"

          # 提取仓库路径
          repo_path = parsed.path.strip("/")

          if repo_path.endswith(".git"):
              repo_path = repo_path[:-4]

          parts = repo_path.split("/")

          if len(parts) < 2:
              raise SystemExit("invalid repository path")

          owner = parts[-2]
          repository = parts[-1]

          # 生成目标地址
          update_url = (
              f"{base_url}/{owner}/{repository}"
              f"/raw/master/core.user.js"
          )

          text = source.read_text(encoding="utf-8")

          # @updateURL
          text, update_count = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{update_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # @downloadURL
          text, download_count = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{update_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if update_count != 1:
              raise SystemExit("updateURL not found")

          if download_count != 1:
              raise SystemExit("downloadURL not found")

          target.write_text(
              text,
              encoding="utf-8"
          )

          print("prepare completed")
          PY


      - name: Verify
        run: |
          set -e

          test -f core.user.js

          grep -q "@updateURL" core.user.js
          grep -q "@downloadURL" core.user.js

          echo "verification completed"


      - name: Fetch
        env:
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e

          AUTH_REPO="$GITEE_REPO"

          AUTH_REPO="${AUTH_REPO/https:\/\//https:\/\/oauth2:${GITEE_TOKEN}@}"

          git clone \
            --branch master \
            --single-branch \
            "$AUTH_REPO" \
            target


      - name: Deploy
        run: |
          set -e

          cp \
            core.user.js \
            target/core.user.js


      - name: Commit
        working-directory: target
        run: |
          set -e

          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"

          git add core.user.js

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "update"


      - name: Push
        working-directory: target
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e

          git push origin master
