name: Sync Gitee CN

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 获取 GitHub 源码
      - name: Checkout
        uses: actions/checkout@v4

      # 生成国内版
      - name: Generate CN version
        env:
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import os
          from urllib.parse import urlparse

          source = Path("GXELA-auto-learn.user.js")
          target = Path("core.user.js")

          repo = os.environ["GITEE_REPO"].rstrip("/")

          # 从仓库地址自动生成 Raw 地址
          parsed = urlparse(repo)

          if parsed.netloc != "gitee.com":
              raise SystemExit("错误：GITEE_REPO 必须是 Gitee 仓库地址")

          path = parsed.path.strip("/")

          if path.endswith(".git"):
              path = path[:-4]

          cn_url = f"https://gitee.com/{path}/raw/master/core.user.js"

          text = source.read_text(encoding="utf-8")

          # 替换 @updateURL
          text, n1 = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # 替换 @downloadURL
          text, n2 = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if n1 != 1:
              raise SystemExit("错误：没有找到 @updateURL")

          if n2 != 1:
              raise SystemExit("错误：没有找到 @downloadURL")

          target.write_text(text, encoding="utf-8")

          print("CN 版本生成成功")
          PY

      # Clone Gitee
      - name: Clone Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -e

          # 把 Token 临时注入 Clone 地址
          AUTH_URL="${GITEE_REPO/https:\/\//https:\/\/oauth2:${GITEE_TOKEN}@}"

          git clone \
            --branch master \
            --single-branch \
            "$AUTH_URL" \
            gitee-release

      # 更新文件
      - name: Update Gitee
        run: |
          set -e

          cp core.user.js \
             gitee-release/core.user.js

      # 提交并推送
      - name: Push Gitee
        working-directory: gitee-release
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add core.user.js

          if git diff --cached --quiet; then
            echo "没有变化，无需同步"
            exit 0
          fi

          git commit -m "Update release"
          git push origin master
