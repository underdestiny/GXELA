name: Sync Gitee CN

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-gitee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4

      - name: Generate CN userscript
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path("GXELA-auto-learn.user.js")

          if not file.exists():
              raise SystemExit("找不到 GXELA-auto-learn.user.js")

          text = file.read_text(encoding="utf-8")

          cn_url = (
              "https://gitee.com/underdestiny/GXELA/"
              "raw/cn/GXELA-auto-learn.user.js"
          )

          text, n1 = re.subn(
              r'^(\s*//\s*@updateURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          text, n2 = re.subn(
              r'^(\s*//\s*@downloadURL\s+).*$',
              rf'\g<1>{cn_url}',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if n1 != 1:
              raise SystemExit(
                  "没有找到 @updateURL，请检查脚本头部"
              )

          if n2 != 1:
              raise SystemExit(
                  "没有找到 @downloadURL，请检查脚本头部"
              )

          file.write_text(text, encoding="utf-8")

          print("CN 版本生成成功")
          print(f"@updateURL:   {cn_url}")
          print(f"@downloadURL: {cn_url}")
          PY

      - name: Get Gitee file information
        id: gitee_file
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e

          RESPONSE=$(curl -fsSL \
            -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/underdestiny/GXELA/contents/GXELA-auto-learn.user.js?ref=cn")

          echo "$RESPONSE" > gitee-file.json

          SHA=$(python3 - <<'PY'
          import json

          with open("gitee-file.json", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              raise SystemExit(
                  "Gitee 返回的是目录列表，而不是文件对象"
              )

          print(data["sha"])
          PY
          )

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Encode userscript
        id: encode
        run: |
          CONTENT=$(base64 -w 0 GXELA-auto-learn.user.js)
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"

      - name: Update Gitee CN branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_SHA: ${{ steps.gitee_file.outputs.sha }}
          CONTENT: ${{ steps.encode.outputs.content }}
        run: |
          set -e

          curl -fsSL \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/underdestiny/GXELA/contents/GXELA-auto-learn.user.js" \
            --data @- <<EOF
          {
            "access_token": "${GITEE_TOKEN}",
            "message": "Sync CN version from GitHub ${GITHUB_SHA}",
            "content": "${CONTENT}",
            "sha": "${GITEE_SHA}",
            "branch": "cn"
          }
          EOF
